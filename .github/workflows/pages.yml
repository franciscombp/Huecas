name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/huecas-game-prototype-ds7407
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publica el contenido de la rama en gh-pages, de donde sirve Pages.
      # (excluye .github por defecto)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          enable_jekyll: false
